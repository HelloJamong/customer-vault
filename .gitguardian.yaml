version: 2

paths-ignore:
  # .env.example만 제외한다. "**/*.example" 를 통째로 제외하면
  # 다른 example 파일에 실제 시크릿이 들어가도 탐지되지 않는다.
  - "**/.env.example"
  - "**/.env.*.example"
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/.vite/**"
  - "**/build/**"

# 실제 .env 파일들은 .gitignore에 있어서 무시됨을 명시
# GitGuardian이 로컬 파일을 스캔할 때 경고하지 않도록 설정
