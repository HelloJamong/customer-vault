# 고객창고 (Customer-Storage) - 통합 Docker Compose 설정
#
# ── 온라인 ─────────────────────────────────────────────────────────────
#   docker compose up -d          # 이미지는 Docker Hub에서 자동 pull
#   docker compose pull && docker compose up -d   # 업그레이드
#
# ── 오프라인 / 폐쇄망 ──────────────────────────────────────────────────
#   1) GitHub Release에서 customer-vault-images-<버전>.tar.gz 다운로드
#   2) docker load -i customer-vault-images-<버전>.tar.gz
#        → backend / frontend / mariadb:10.11 / nginx:alpine 이미지가 로컬에 로드됨
#   3) .env 에 VERSION=<버전>, NODE_ENV=production 설정
#   4) docker compose up -d
#        → 이미지가 로컬에 있으면 pull하지 않으므로 이 파일 그대로 사용 가능
#      (build: 섹션은 `docker compose up`에서 무시되어 소스 코드가 없어도 동작)

services:
  # ==========================================
  # MariaDB 데이터베이스
  # ==========================================
  db:
    image: mariadb:10.11
    container_name: customer_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-customer_db}
      MYSQL_USER: ${DB_USER:-customer_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-customerpass}
    volumes:
      - ./data/mariadb:/var/lib/mysql
    ports:
      # 호스트 로컬에만 바인딩 (외부 네트워크에 DB를 노출하지 않음)
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    networks:
      - customer_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ==========================================
  # NestJS 백엔드 API
  # ==========================================
  backend:
    image: igor0670/customer-storage-backend:${VERSION:-latest}
    # 오프라인: 위 이미지를 `docker load`로 미리 로드해두면 pull 없이 그대로 사용됩니다.
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: customer_backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 5000
      DATABASE_URL: mysql://${DB_USER:-customer_user}:${DB_PASSWORD:-customerpass}@db:3306/${DB_NAME:-customer_db}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env (openssl rand -hex 64)}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-1h}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-7d}
      UPLOAD_DIR: /app/uploads
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-16777216}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_DIR: /app/logs
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      BACKUP_DIR: /app/backups
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set in .env (openssl rand -hex 32)}
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
      - ./backups:/app/backups
      # 대시보드 호스트 메모리 표시용. /sys, /etc는 사용하지 않으므로 마운트하지 않는다.
      - /proc:/host/proc:ro
    ports:
      - "${BACKEND_PORT:-5005}:5000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - customer_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ==========================================
  # React 프론트엔드
  # ==========================================
  frontend:
    image: igor0670/customer-storage-frontend:${VERSION:-latest}
    # 오프라인: 위 이미지를 `docker load`로 미리 로드해두면 pull 없이 그대로 사용됩니다.
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-/api}
        - VITE_APP_VERSION=${VERSION:-dev}
    container_name: customer_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - customer_network

  # ==========================================
  # Nginx 리버스 프록시
  # ==========================================
  proxy:
    image: nginx:alpine
    container_name: customer_proxy
    restart: unless-stopped
    ports:
      - "${PROXY_PORT:-2082}:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - customer_network

networks:
  customer_network:
    driver: bridge

volumes:
  mariadb_data:
    driver: local
