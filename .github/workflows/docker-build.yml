name: Docker Build and Push

# 이 워크플로우는 다음 경우에 실행됩니다:
# 1. main 브랜치에 push될 때 (latest 이미지 갱신)
# 2. 숫자로 시작하는 버전 태그가 push될 때 (예: 26.7.0) — 버전 이미지 + Release 생성

on:
  push:
    branches: [ main ]
    tags: [ '[0-9]*' ]
  workflow_dispatch:  # 수동 실행 허용

# GitHub Actions 권한 설정
permissions:
  contents: write  # Release 생성을 위한 권한
  packages: write  # 패키지 업로드 권한 (선택)

env:
  # Docker Hub 이미지 이름
  BACKEND_IMAGE_NAME: igor0670/customer-storage-backend
  FRONTEND_IMAGE_NAME: igor0670/customer-storage-frontend

jobs:
  build-and-push-backend:
    runs-on: ubuntu-latest

    steps:
      # 1. 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Docker Buildx 설정 (멀티 플랫폼 빌드 지원)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Docker Hub 로그인
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. 메타데이터 추출 (태그 및 레이블)
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BACKEND_IMAGE_NAME }}
          tags: |
            # main 브랜치 푸시 시 latest 태그
            type=raw,value=latest,enable={{is_default_branch}}
            # 버전 태그 푸시 시 그대로 이미지 태그로 사용 (예: 26.7.0)
            type=match,pattern=(\d+\.\d+\.\d+),group=1

      # 5. Backend Docker 이미지 빌드 및 푸시
      - name: Build and push Backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # AMD64 플랫폼만 지원 (ARM64는 QEMU 이슈로 제외)
          platforms: linux/amd64
          # 빌드 캐시 사용으로 빌드 시간 단축
          cache-from: type=registry,ref=${{ env.BACKEND_IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.BACKEND_IMAGE_NAME }}:buildcache,mode=max

      # 6. 빌드 결과 출력
      - name: Backend image digest
        run: echo "${{ steps.meta.outputs.tags }}"

  build-and-push-frontend:
    runs-on: ubuntu-latest

    steps:
      # 1. 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Docker Buildx 설정 (멀티 플랫폼 빌드 지원)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Docker Hub 로그인
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. 메타데이터 추출 (태그 및 레이블)
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FRONTEND_IMAGE_NAME }}
          tags: |
            # main 브랜치 푸시 시 latest 태그
            type=raw,value=latest,enable={{is_default_branch}}
            # 버전 태그 푸시 시 그대로 이미지 태그로 사용 (예: 26.7.0)
            type=match,pattern=(\d+\.\d+\.\d+),group=1

      # 5. Frontend Docker 이미지 빌드 및 푸시
      - name: Build and push Frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            VITE_APP_VERSION=${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # AMD64 플랫폼만 지원 (ARM64는 QEMU 이슈로 제외)
          platforms: linux/amd64
          # 빌드 캐시 사용으로 빌드 시간 단축
          cache-from: type=registry,ref=${{ env.FRONTEND_IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.FRONTEND_IMAGE_NAME }}:buildcache,mode=max

      # 6. 빌드 결과 출력
      - name: Frontend image digest
        run: echo "${{ steps.meta.outputs.tags }}"

  # GitHub Release 생성 (버전 태그 푸시 시에만)
  create-release:
    needs: [build-and-push-backend, build-and-push-frontend]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      # CHANGELOG.md에서 해당 버전 섹션만 추출
      - name: Extract changelog for version
        id: changelog
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          NOTES=$(awk "/^## \[${VERSION}\]/{found=1; next} /^## \[/{if(found) exit} found{print}" CHANGELOG.md)
          # 멀티라인 output 처리
          {
            echo "NOTES<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      # 오프라인(폐쇄망) 배포용 이미지 번들 생성
      # backend/frontend는 방금 push된 Docker Hub 이미지를, db/proxy는 compose에서 쓰는 베이스 이미지를 포함
      - name: Build offline image bundle
        run: |
          V="${{ steps.version.outputs.VERSION }}"
          docker pull "${{ env.BACKEND_IMAGE_NAME }}:$V"
          docker pull "${{ env.FRONTEND_IMAGE_NAME }}:$V"
          docker pull mariadb:10.11
          docker pull nginx:alpine
          docker save \
            "${{ env.BACKEND_IMAGE_NAME }}:$V" \
            "${{ env.FRONTEND_IMAGE_NAME }}:$V" \
            mariadb:10.11 \
            nginx:alpine \
            | gzip > "customer-vault-images-$V.tar.gz"
          ls -lh "customer-vault-images-$V.tar.gz"

      # .env.example은 점(.)으로 시작해 Release 자산으로 올리면 이름이 바뀌므로 복사본을 만든다
      - name: Prepare env template asset
        run: cp .env.example env.example

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            docker-compose.yml
            env.example
            customer-vault-images-${{ steps.version.outputs.VERSION }}.tar.gz
          body: |
            ## 변경 사항

            ${{ steps.changelog.outputs.NOTES }}

            ---

            ## 빠른 시작 (온라인 · 신규 설치)

            ```bash
            V=${{ steps.version.outputs.VERSION }}
            curl -L -o docker-compose.yml https://github.com/HelloJamong/customer-vault/releases/download/$V/docker-compose.yml
            curl -L -o .env https://github.com/HelloJamong/customer-vault/releases/download/$V/env.example
            # .env 를 열어 JWT_SECRET, ENCRYPTION_KEY, 비밀번호, VERSION 등 수정
            docker compose up -d
            ```

            ## 온라인 · 업그레이드 (기존 설치)

            ```bash
            V=${{ steps.version.outputs.VERSION }}
            curl -L -o docker-compose.yml https://github.com/HelloJamong/customer-vault/releases/download/$V/docker-compose.yml
            # .env 의 VERSION=$V 로 수정
            docker compose pull && docker compose up -d
            ```

            ## 오프라인 · 폐쇄망 배포

            인터넷이 없는 서버에서는 아래 이미지 번들을 함께 받아 반입합니다.

            ```bash
            V=${{ steps.version.outputs.VERSION }}
            # 인터넷 되는 곳에서 3개 파일 다운로드:
            #   docker-compose.yml, env.example, customer-vault-images-$V.tar.gz
            # → USB 등으로 폐쇄망 서버에 복사

            # 폐쇄망 서버에서:
            docker load -i customer-vault-images-$V.tar.gz   # 4개 이미지(backend/frontend/mariadb/nginx) 로드
            cp env.example .env                              # .env 에 VERSION=$V, NODE_ENV=production, 시크릿 설정
            docker compose up -d                             # 로컬에 이미지가 있으면 pull 하지 않음
            ```

            ## Docker Images

            ```
            docker pull igor0670/customer-storage-backend:${{ steps.version.outputs.VERSION }}
            docker pull igor0670/customer-storage-frontend:${{ steps.version.outputs.VERSION }}
            ```

      # 7. 슬랙 알림 (선택사항, SLACK_WEBHOOK_URL 시크릿 설정 필요)
